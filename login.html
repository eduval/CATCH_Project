<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>CATCH | Sign In</title>
    <meta name="viewport" content="width=device-width, maximum-scale=5, initial-scale=1">

    <link rel="stylesheet" href="assets/css/core.min.css">
    <link rel="stylesheet" href="assets/css/vendor_bundle.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap">
  </head>
  <body class="d-flex align-items-center bg-light min-vh-100">

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-5 col-lg-4">

          <div class="text-center mb-5">
            <h1 class="h2 fw-bold text-primary mb-1">CATCH</h1>
            <p class="text-muted small text-uppercase fw-bold">Attendance Hub</p>
          </div>

          <div class="card shadow-sm border-0 rounded-xl overflow-hidden">
            <div class="card-body p-4 p-md-5 bg-white">
              
              <h4 class="fw-bold mb-4 text-start">Sign In</h4>

              <form onsubmit="handleLogin(event)">
                <div class="form-floating mb-3">
                  <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                  <label for="email">Email address</label>
                </div>

                <div class="form-floating mb-3">
                  <input type="password" class="form-control" id="password" placeholder="Password" required>
                  <label for="password">Password</label>
                </div>

                <div class="d-flex justify-content-between mb-4 small">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">Sign In</button>
              </form>

            </div>
          </div>

          <div class="text-center mt-4 text-muted small">
            &copy; 2026 CATCH
          </div>

        </div>
      </div>
    </div>

    <script src="assets/js/core.min.js"></script>
    <script src="assets/js/vendor_bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
  // 1. Configuración corregida (Asegúrate de que databaseURL termine en la raíz .com/)
  const firebaseConfig = {
  apiKey: "AIzaSyBviEaIKKwNPXnxQcHlq3y-Zzs8bY-SqaU",
  authDomain: "cctb-catch-testing.firebaseapp.com",
  databaseURL: "https://cctb-catch-testing-default-rtdb.firebaseio.com",
  projectId: "cctb-catch-testing",
  storageBucket: "cctb-catch-testing.firebasestorage.app",
  messagingSenderId: "734153648345",
  appId: "1:734153648345:web:7692ec17fc87adc463b6c8",
  measurementId: "G-PSTJ6T7LC7"
};

  // Inicializar Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const database = firebase.database();

  // 2. Función de Login controlada por Firebase Auth
  function handleLogin(event) {
    event.preventDefault();

    const emailInput = document.getElementById('email').value.trim();
    const passwordInput = document.getElementById('password').value;

    // Iniciar sesión con el servicio de Autenticación
    auth.signInWithEmailAndPassword(emailInput, passwordInput)
      .then((userCredential) => {
        // Si el correo y la clave son correctos, extraemos el prefijo antes del '@'
        // 'admin@catch.hub' -> 'admin'  ||  'operator@catch.hub' -> 'operator'
        const userKey = emailInput.split('@')[0];

        // Buscamos ese nodo exacto en Realtime Database para validar su Rol
        return database.ref('users/' + userKey).once('value');
      })
      .then((snapshot) => {
        const userData = snapshot.val();

        if (userData && userData.role) {
          // Guardamos las banderas de sesión en el navegador
          localStorage.setItem('isLoggedIn', 'true');
          localStorage.setItem('userRole', userData.role.toLowerCase());
          localStorage.setItem('userEmail', emailInput);

          // Evaluamos el rol para decidir a dónde enviarlo
          if (userData.role.toLowerCase() === 'admin') {
            alert("Welcome back, Administrator!");
            window.location.href = 'index.html';
          } else if (userData.role.toLowerCase() === 'operator') {
            alert("Welcome back, Operator!");
            window.location.href = 'operator.html'; // Te dará 404 hasta que crees la página del operador
          } else {
            alert("Access granted, but role is undefined.");
          }
        } else {
          alert("Error: User configuration not found in Realtime Database.");
        }
      })
      .catch((error) => {
        console.error("Login Error:", error);
        alert("Authentication failed: " + error.message);
      });
  }
</script>
  </body>
</html>
