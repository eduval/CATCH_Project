<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>CATCH | Sign In</title>
    <meta name="viewport" content="width=device-width, maximum-scale=5, initial-scale=1">

    <link rel="stylesheet" href="assets/css/core.min.css">
    <link rel="stylesheet" href="assets/css/vendor_bundle.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap">
  </head>
  <body class="d-flex align-items-center bg-light min-vh-100">

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-5 col-lg-4">

          <div class="text-center mb-5">
            <h1 class="h2 fw-bold text-primary mb-1">CATCH</h1>
            <p class="text-muted small text-uppercase fw-bold">Attendance Hub</p>
          </div>

          <div class="card shadow-sm border-0 rounded-xl overflow-hidden">
            <div class="card-body p-4 p-md-5 bg-white">
              
              <h4 class="fw-bold mb-4 text-start">Sign In</h4>

              <form onsubmit="handleLogin(event)">
                <div class="form-floating mb-3">
                  <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                  <label for="email">Email address</label>
                </div>

                <div class="form-floating mb-3">
                  <input type="password" class="form-control" id="password" placeholder="Password" required>
                  <label for="password">Password</label>
                </div>

                <div class="d-flex justify-content-between mb-4 small">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">Sign In</button>
              </form>

            </div>
          </div>

          <div class="text-center mt-4 text-muted small">
            &copy; 2026 CATCH
          </div>

        </div>
      </div>
    </div>

    <script src="assets/js/core.min.js"></script>
    <script src="assets/js/vendor_bundle.min.js"></script>

    <script>
      function handleLogin(event) {
        // 1. Evitamos que la página se recargue automáticamente
        event.preventDefault();

        // 2. Capturamos los datos que escribió el usuario (por si los necesitas después)
        const emailInput = document.getElementById('email').value;
        const passwordInput = document.getElementById('password').value;

        // Opcional: Aquí podrías poner una validación fija si quieres, por ejemplo:
        // if (passwordInput.length < 6) { alert("Short password"); return; }

        // 3. Creamos de forma exitosa la sesión en el almacenamiento local del navegador
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userEmail', emailInput); // Guarda el correo para usarlo en el perfil si quieres

        // 4. Redirigimos manualmente al index ahora que ya tiene el permiso guardado
        window.location.href = 'index.html';
      }
    </script>

  </body>
</html>
