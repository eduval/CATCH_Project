  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyBviEaIKKwNPXnxQcHlq3y-Zzs8bY-SqaU",
  authDomain: "cctb-catch-testing.firebaseapp.com",
  databaseURL: "https://cctb-catch-testing-default-rtdb.firebaseio.com",
  projectId: "cctb-catch-testing",
  storageBucket: "cctb-catch-testing.firebasestorage.app",
  messagingSenderId: "734153648345",
  appId: "1:734153648345:web:7692ec17fc87adc463b6c8",
  measurementId: "G-PSTJ6T7LC7"
};

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let currentEventId = "active_session"; 
    let currentZonesData = {};
    let activeZoneKey = null;

    function addZoneInput() {
        const html = `<div class="input-group mb-2 zone-input-row"><input type="text" class="form-control" placeholder="Zone Name..."><button class="btn btn-outline-danger" onclick="this.parentElement.remove()">Remove</button></div>`;
        document.getElementById('zone-setup-list').insertAdjacentHTML('beforeend', html);
    }

    function initializeSession() {
        const name = document.getElementById('session-name').value.trim();
        const date = document.getElementById('session-date').value;
        if(!name || !date) return alert("Required: Name and Date.");

        let zonesPayload = {};
        document.querySelectorAll('.zone-input-row input').forEach((inp, i) => {
            if(inp.value) {
                const zoneKey = `zone_${i}`;
                zonesPayload[zoneKey] = {
                    name: inp.value,
                    status: "activo",
                    photoUrl: "",
                    count: 0,
                    feedback: ""
                };
            }
        });

        database.ref('events/' + currentEventId).set({
            name: name,
            date: date,
            zones: zonesPayload
        }).then(() => {
            listenToLiveSession();
        }).catch(err => alert("Firebase Error: " + err.message));
    }

    function listenToLiveSession() {
        database.ref('events/' + currentEventId).on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                document.getElementById('step-setup').classList.remove('d-none');
                document.getElementById('step-manage').classList.add('d-none');
                document.getElementById('session-indicator-ui').className = 'd-none';
                return;
            }

            document.getElementById('display-name').innerText = data.name;
            document.getElementById('display-date').innerText = "Event Date: " + data.date;
            document.getElementById('step-setup').classList.add('d-none');
            document.getElementById('step-manage').classList.remove('d-none');
            document.getElementById('session-indicator-ui').className = 'd-block';

            currentZonesData = data.zones || {};
            renderZones(currentZonesData);
        });
    }

    function renderZones(zonesObj) {
        const grid = document.getElementById('zone-grid');
        grid.innerHTML = '';

        Object.keys(zonesObj).forEach(key => {
            const z = zonesObj[key];
            const card = document.createElement('div');
            card.className = 'col-md-4';
            
            let statusClass = '';
            let badgeClass = 'bg-secondary text-white';
            let statusText = 'ACTIVE'; // Por defecto si no entra a los otros

            // Evaluamos lo que viene de Firebase en español, pero asignamos inglés real
            if (z.status === 'terminado') {
                statusClass = 'validated';
                badgeClass = 'bg-success text-white';
                statusText = 'COMPLETED';
            } else if (z.status === 'pendiente') {
                statusClass = 'pending-review';
                badgeClass = 'bg-warning text-dark';
                statusText = 'PENDING';
            } else if (z.status === 'activo') {
                if (z.feedback && z.feedback !== "Accepted & Processed via CATCH AI Engine") {
                    statusClass = 'rejected';
                    badgeClass = 'bg-danger text-white';
                    statusText = 'REJECTED';
                } else {
                    statusClass = '';
                    badgeClass = 'bg-secondary text-white';
                    statusText = 'ACTIVE';
                }
            }

            card.innerHTML = `
                <div class="zone-card p-4 d-flex flex-column ${statusClass}">
                    <div class="d-flex justify-content-between mb-3">
                        <h6 class="fw-bold mb-0">${z.name}</h6>
                        <span class="status-badge ${badgeClass}">${statusText}</span>
                    </div>

                    ${z.photoUrl ? 
                        `<img src="${z.photoUrl}" class="img-preview">` : 
                        `<div class="bg-light rounded flex-grow-1 d-flex align-items-center justify-content-center text-muted mb-3 small border-dashed text-center px-3">
                            <span>${z.status === 'activo' && z.feedback && z.feedback !== "Accepted & Processed via CATCH AI Engine" ? `⚠️ Rejected: <br><strong class="text-danger">${z.feedback}</strong><br>Waiting for retake...` : 'Waiting for operator photo...'}</span>
                        </div>`
                    }

                    <div class="mt-auto">
                        ${z.status === 'pendiente' ? `
                            <button class="btn btn-sm btn-primary w-100 fw-bold animate-pulse" onclick="openGallery('${key}')">
                              Review Operator Photo
                            </button>
                        ` : z.status === 'terminado' ? `
                            <div class="text-center py-2 bg-white rounded border">
                                <div class="h3 fw-bold text-success mb-0">${z.count}</div>
                                <small class="text-muted fw-bold text-uppercase">AI Counted People</small>
                            </div>
                        ` : `
                            <button class="btn btn-sm btn-light w-100 text-muted" disabled>Waiting Submission</button>
                        `}
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
        updateSaveButton();
    }

    function openGallery(zoneKey) {
        activeZoneKey = zoneKey;
        const targetZone = currentZonesData[zoneKey];
        document.getElementById('gallery-zone-name').innerText = targetZone.name;
        document.getElementById('rejection-feedback').value = "";
        
        const container = document.getElementById('submission-container');
        container.innerHTML = `<img src="${targetZone.photoUrl}" class="img-fluid rounded border shadow-xs" style="max-height:300px; object-fit:contain;">`;

        // Reactivamos el botón de la IA por si acaso quedó deshabilitado en consultas previas
        const btn = document.getElementById('ai-trigger-btn');
        btn.disabled = false;
        btn.innerHTML = `✅ Accept & AI Count`;

        new bootstrap.Modal(document.getElementById('galleryModal')).show();
    }

    function rejectSubmission() {
        const fbText = document.getElementById('rejection-feedback').value.trim() || "Photo did not meet standards. Please take another shot.";
        
        database.ref(`events/${currentEventId}/zones/${activeZoneKey}`).update({
            status: "activo",
            photoUrl: "", 
            feedback: fbText
        }).then(() => {
            bootstrap.Modal.getInstance(document.getElementById('galleryModal')).hide();
        });
    }

    function approveAndCount() {
    const targetZone = currentZonesData[activeZoneKey];
    const base64Photo = targetZone ? targetZone.photoUrl : ""; 
    
    const btn = document.getElementById('ai-trigger-btn');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status"></span> Analyzing image objects via CATCH AI...`;

    fetch("http://localhost:5000/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: base64Photo })
    })
    .then(response => {
        if (!response.ok) throw new Error("HTTP Error: " + response.status);
        return response.json();
    })
    .then(aiResponse => {
        console.log("🎯 Response received from Node.js:", aiResponse);

        // --- TU LÓGICA DE FILTRADO EXACTA ---
        const CONFIDENCE_THRESHOLD = 0.5;
        const TARGET_CLASS = "person";
        const results = aiResponse?.images?.[0]?.results || [];
        
        let attendance = 0;
        results.forEach((obj) => {
            if (obj.confidence < CONFIDENCE_THRESHOLD) return;
            if (obj.name === TARGET_CLASS) attendance++;
        });
        // -------------------------------------

        console.log(`📊 Calculated count: ${attendance}. Trying to save to Firebase...`);

        // Guardamos en Firebase asegurándonos de que si falla, atrape el error aquí mismo
        return database.ref(`events/${currentEventId}/zones/${activeZoneKey}`).update({
            status: "terminado",
            count: attendance, 
            feedback: "Accepted & Processed via CATCH AI Engine"
        });
    })
    .then(() => {
        // Si todo sale bien, cierra el modal
        const modalEl = document.getElementById('galleryModal');
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        if (modalInstance) modalInstance.hide();
    })
    .catch(err => {
        console.error("❌ Error in the process:", err);
        alert("System Notice: " + err.message + "\nCheck browser console for details.");
        btn.disabled = false;
        btn.innerHTML = `✅ Accept & AI Count`;
    });
}

    function updateSaveButton() {
        const zonesKeys = Object.keys(currentZonesData);
        if(zonesKeys.length === 0) return;
        
        const allDone = zonesKeys.every(k => currentZonesData[k].status === 'terminado');
        const btn = document.getElementById('save-session-btn');
        allDone ? btn.classList.remove('d-none') : btn.classList.add('d-none');
    }

    function saveToSystem() {
        let totalAttendance = 0;
        let breakdown = [];
        
        Object.keys(currentZonesData).forEach(k => {
            totalAttendance += currentZonesData[k].count;
            breakdown.push({ name: currentZonesData[k].name, count: currentZonesData[k].count });
        });

        // 📝 Armamos la estructura exacta de datos que espera Firebase y records.html
        const archiveRecord = {
            name: document.getElementById('display-name').innerText,
            date: document.getElementById('display-date').innerText.replace("Event Date: ", ""),
            total: totalAttendance,
            breakdown: breakdown
        };

        // 1. Guardar localmente (por respaldo en tu localStorage)
        let localHistory = localStorage.getItem('catch_saved_event_history');
        localHistory = localHistory ? JSON.parse(localHistory) : [];
        localHistory.unshift(archiveRecord);
        localStorage.setItem('catch_saved_event_history', JSON.stringify(localHistory));

        console.log("📤 Subiendo registro histórico a Firebase...");

        // 2. 🚀 ENVIAR A FIREBASE (El paso que faltaba)
        // Subimos el registro al nodo 'records' para que records.html lo lea en tiempo real
        database.ref('records').push(archiveRecord)
            .then(() => {
                console.log("✅ Guardado en historial de Firebase. Limpiando sesión activa...");
                // 3. Una vez asegurado en el historial, limpiamos de la nube la sesión de conteo activo
                return database.ref('events/' + currentEventId).remove();
            })
            .then(() => {
                alert("Success: Event finalized, verified and committed to cloud historical records.");
                location.reload();
            })
            .catch(err => {
                console.error("❌ Error al archivar en Firebase:", err);
                alert("Error saving to cloud history: " + err.message);
            });
    }

    function cancelSession() {
        if (confirm("Completely wipe this live cloud session? Operators will lose access immediately.")) {
            database.ref('events/' + currentEventId).remove().then(() => {
                location.reload();
            });
        }
    }

    window.onload = listenToLiveSession;
  </script>
