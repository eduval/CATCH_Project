<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CATCH | Active Counting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link class="rtl-invert" rel="stylesheet" href="assets/css/core.min.css">
  <link rel="stylesheet" href="assets/css/vendor_bundle.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap">
  
  <style>
    #aside-main .nav-link { display: flex; align-items: center; padding: 0.8rem 1.5rem; color: #495057; font-weight: 500; transition: all 0.2s ease-in-out; text-decoration: none; }
    #aside-main .nav-item.active .nav-link, #aside-main .nav-link:hover { color: #007bff; background-color: #f8f9fa; }
    #aside-main .nav-item.active { border-left: 4px solid #007bff; }
    #aside-main .nav-title { letter-spacing: 0.5px; opacity: 0.8; }

    /* Card UI Custom Styling */
    .zone-card { border: 2px solid #e9ecef; border-radius: 12px; transition: 0.2s; background: #fff; min-height: 320px; position: relative; }
    .zone-card.validated { border-color: #28a745; background-color: #f8fff9; }
    .zone-card.has-selection { border-color: #007bff; background-color: #f0f7ff; }
    .zone-card.rejected { border-color: #dc3545; background-color: #fff5f5; }
    .zone-card.pending-review { border-color: #ffc107; background-color: #fffdf5; }
    
    .img-preview { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; margin-bottom: 15px; border: 1px solid #dee2e6; }
    .status-badge { font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 20px; text-transform: uppercase; }
    
    .submission-item { cursor: pointer; border: 2px solid transparent; transition: 0.2s; border-radius: 8px; overflow: hidden; position: relative; }
    .submission-item:hover { border-color: #007bff; }
    .submission-item.selected { border-color: #007bff; box-shadow: 0 0 10px rgba(0,123,255,0.3); }
    .submission-item img { width: 100%; height: 150px; object-fit: cover; }
    .submission-meta { font-size: 10px; padding: 8px; background: #f8f9fa; border-top: 1px solid #eee; }
  </style>

  <script>
    if (localStorage.getItem('isLoggedIn') !== 'true' || localStorage.getItem('userRole') !== 'admin') {
      window.location.href = 'login.html';
    }
  </script>
</head>

<body class="layout-admin aside-sticky bg-light header-sticky">

  <div id="wrapper" class="d-flex align-items-stretch flex-column">

    <header id="header" class="d-flex align-items-center shadow-xs bg-white">
      <div class="container-fluid">
        <nav class="navbar navbar-expand-lg navbar-light justify-content-between">
          <a class="navbar-brand mx-2" href="index.html"><span class="h4 fw-bold text-primary">CATCH</span></a>
          <div id="session-indicator-ui" class="d-none">
            <span class="badge bg-success-soft text-success px-3 py-2">● LIVE CLOUD SESSION RUNNING</span>
          </div>
        </nav>
      </div>
    </header>

    <div id="wrapper_content" class="d-flex flex-fill">

      <aside id="aside-main" class="aside-start aside-hide-xs bg-white shadow-sm d-flex flex-column px-2">
        <div class="py-4 px-3 mb-3 border-bottom text-center">
          <h4 class="fw-bold text-primary mb-0">CATCH</h4>
          <small class="text-muted fw-bold text-uppercase" style="font-size: 10px; letter-spacing: 1px;">Service Track</small>
        </div>
        <nav class="nav-deep nav-deep-sm nav-deep-light">
          <ul class="nav flex-column">
            <li class="nav-title text-muted smaller fw-bold text-uppercase mb-2 ps-4">Operations</li>
            <li class="nav-item"><a class="nav-link" href="index.html"><span>Dashboard</span></a></li>
            <li class="nav-item active">
              <a class="nav-link d-flex align-items-center" href="active-counting.html">
                <span>Active Counting</span>
                <span class="badge bg-danger-soft text-danger ms-auto smaller py-1 px-2">LIVE</span>
              </a>
            </li>
            <li class="nav-item"><a class="nav-link" href="reports.html"><span>Reports/Analytics</span></a></li>
            <li class="nav-item border-bottom pb-3"><a class="nav-link" href="records.html"><span>Attendance Records</span></a></li>
            <li class="nav-title text-muted smaller fw-bold text-uppercase mt-4 mb-2 ps-4">Management</li>
            <li class="nav-item"><a class="nav-link" href="profile.html"><span>My Profile</span></a></li>
            <li class="nav-item"><a class="nav-link" href="settings.html"><span>System Settings</span></a></li>
          </ul>
        </nav>
      </aside>

      <main id="middle" class="flex-fill p-4">
        
        <div id="step-setup" class="py-4">
            <div class="card shadow-xs border-0 mx-auto" style="max-width: 650px;">
                <div class="card-body p-5">
                    <h4 class="fw-bold mb-4">Start New Cloud Session</h4>
                    <div class="row g-3 mb-4 text-start">
                        <div class="col-md-8">
                            <label class="form-label small fw-bold">EVENT NAME</label>
                            <input type="text" class="form-control py-3" id="session-name" placeholder="Sunday Morning Service">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">DATE</label>
                            <input type="date" class="form-control py-3" id="session-date">
                        </div>
                    </div>

                    <div class="mb-4 text-start">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label small fw-bold">ZONES FOR THIS EVENT</label>
                            <button class="btn btn-sm btn-outline-primary" onclick="addZoneInput()">+ Add Zone</button>
                        </div>
                        <div id="zone-setup-list" class="bg-light p-3 rounded">
                            <div class="input-group mb-2 zone-input-row">
                                <input type="text" class="form-control" value="Main Hall">
                                <button class="btn btn-outline-danger" onclick="this.parentElement.remove()">Remove</button>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-primary btn-lg w-100 py-3 fw-bold" onclick="initializeSession()">Publish Event to Cloud</button>
                </div>
            </div>
        </div>

        <div id="step-manage" class="d-none text-start">
            <div class="d-flex justify-content-between align-items-end mb-4">
                <div>
                    <h2 class="h4 mb-0" id="display-name"></h2>
                    <p class="text-muted small mb-0" id="display-date"></p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-danger btn-sm px-3" onclick="cancelSession()">Cancel Session</button>
                    <button class="btn btn-success btn-sm px-4 fw-bold d-none" id="save-session-btn" onclick="saveToSystem()">Finish & Archive Event</button>
                </div>
            </div>

            <div class="row g-4" id="zone-grid"></div>
        </div>

      </main>
    </div>
  </div>

  <div class="modal fade" id="galleryModal" tabindex="-1">
    <div class="modal-dialog modal-md modal-dialog-centered">
      <div class="modal-content border-0">
        <div class="modal-header border-bottom-0 pb-0">
          <h5 class="modal-title fw-bold">Operator Submission: <span id="gallery-zone-name"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body py-4 text-start">
            <div id="submission-container" class="text-center">
                </div>
            <div class="mt-3">
              <label class="form-label small fw-bold text-muted">FEEDBACK ON REJECTION (OPTIONAL)</label>
              <input type="text" id="rejection-feedback" class="form-control" placeholder="E.g., Photo blurry, take another shot please...">
            </div>
        </div>
        <div class="modal-footer border-top-0 d-flex gap-2">
            <button class="btn btn-outline-danger py-3 px-3 fw-bold" onclick="rejectSubmission()">❌ Reject Photo</button>
            <button id="ai-trigger-btn" class="btn btn-success flex-grow-1 py-3 fw-bold" onclick="approveAndCount()">
              ✅ Accept & AI Count
            </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script src="assets/js/core.min.js"></script>
  <script src="assets/js/vendor_bundle.min.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBviEaIKKWNPXnxQcHlq3y-Zzs8bY-SqaU",
      authDomain: "cctb-catch-testing.firebaseapp.com",
      databaseURL: "https://cctb-catch-testing-default-rtdb.firebaseio.com/", 
      projectId: "cctb-catch-testing",
      storageBucket: "cctb-catch-testing.appspot.com"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let currentEventId = "active_session"; 
    let currentZonesData = {};
    let activeZoneKey = null;

    function addZoneInput() {
        const html = `<div class="input-group mb-2 zone-input-row"><input type="text" class="form-control" placeholder="Zone Name..."><button class="btn btn-outline-danger" onclick="this.parentElement.remove()">Remove</button></div>`;
        document.getElementById('zone-setup-list').insertAdjacentHTML('beforeend', html);
    }

    function initializeSession() {
        const name = document.getElementById('session-name').value.trim();
        const date = document.getElementById('session-date').value;
        if(!name || !date) return alert("Required: Name and Date.");

        let zonesPayload = {};
        document.querySelectorAll('.zone-input-row input').forEach((inp, i) => {
            if(inp.value) {
                const zoneKey = `zone_${i}`;
                zonesPayload[zoneKey] = {
                    name: inp.value,
                    status: "activo",
                    photoUrl: "",
                    count: 0,
                    feedback: ""
                };
            }
        });

        database.ref('events/' + currentEventId).set({
            name: name,
            date: date,
            zones: zonesPayload
        }).then(() => {
            listenToLiveSession();
        }).catch(err => alert("Firebase Error: " + err.message));
    }

    function listenToLiveSession() {
        database.ref('events/' + currentEventId).on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                document.getElementById('step-setup').classList.remove('d-none');
                document.getElementById('step-manage').classList.add('d-none');
                document.getElementById('session-indicator-ui').className = 'd-none';
                return;
            }

            document.getElementById('display-name').innerText = data.name;
            document.getElementById('display-date').innerText = "Event Date: " + data.date;
            document.getElementById('step-setup').classList.add('d-none');
            document.getElementById('step-manage').classList.remove('d-none');
            document.getElementById('session-indicator-ui').className = 'd-block';

            currentZonesData = data.zones || {};
            renderZones(currentZonesData);
        });
    }

    function renderZones(zonesObj) {
        const grid = document.getElementById('zone-grid');
        grid.innerHTML = '';

        Object.keys(zonesObj).forEach(key => {
            const z = zonesObj[key];
            const card = document.createElement('div');
            card.className = 'col-md-4';
            
            let statusClass = '';
            let badgeClass = 'bg-secondary text-white';

            if (z.status === 'terminado') {
                statusClass = 'validated';
                badgeClass = 'bg-success text-white';
            } else if (z.status === 'pendiente') {
                statusClass = 'pending-review';
                badgeClass = 'bg-warning text-dark';
            } else if (z.status === 'activo' && z.feedback) {
                statusClass = 'rejected';
                badgeClass = 'bg-danger text-white';
            }

            card.innerHTML = `
                <div class="zone-card p-4 d-flex flex-column ${statusClass}">
                    <div class="d-flex justify-content-between mb-3">
                        <h6 class="fw-bold mb-0">${z.name}</h6>
                        <span class="status-badge ${badgeClass}">${z.status.toUpperCase()}</span>
                    </div>

                    ${z.photoUrl ? 
                        `<img src="${z.photoUrl}" class="img-preview">` : 
                        `<div class="bg-light rounded flex-grow-1 d-flex align-items-center justify-content-center text-muted mb-3 small border-dashed text-center px-3">
                            <span>${z.status === 'activo' && z.feedback ? `⚠️ Rejected: <br><strong class="text-danger">${z.feedback}</strong><br>Waiting for retake...` : 'Waiting for operator photo...'}</span>
                        </div>`
                    }

                    <div class="mt-auto">
                        ${z.status === 'pendiente' ? `
                            <button class="btn btn-sm btn-primary w-100 fw-bold animate-pulse" onclick="openGallery('${key}')">
                              Review Operator Photo
                            </button>
                        ` : z.status === 'terminado' ? `
                            <div class="text-center py-2 bg-white rounded border">
                                <div class="h3 fw-bold text-success mb-0">${z.count}</div>
                                <small class="text-muted fw-bold text-uppercase">AI Counted People</small>
                            </div>
                        ` : `
                            <button class="btn btn-sm btn-light w-100 text-muted" disabled>Waiting Submission</button>
                        `}
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
        updateSaveButton();
    }

    function openGallery(zoneKey) {
        activeZoneKey = zoneKey;
        const targetZone = currentZonesData[zoneKey];
        document.getElementById('gallery-zone-name').innerText = targetZone.name;
        document.getElementById('rejection-feedback').value = "";
        
        const container = document.getElementById('submission-container');
        container.innerHTML = `<img src="${targetZone.photoUrl}" class="img-fluid rounded border shadow-xs" style="max-height:300px; object-fit:contain;">`;

        // Reactivamos el botón de la IA por si acaso quedó deshabilitado en consultas previas
        const btn = document.getElementById('ai-trigger-btn');
        btn.disabled = false;
        btn.innerHTML = `✅ Accept & AI Count`;

        new bootstrap.Modal(document.getElementById('galleryModal')).show();
    }

    function rejectSubmission() {
        const fbText = document.getElementById('rejection-feedback').value.trim() || "Photo did not meet standards. Please take another shot.";
        
        database.ref(`events/${currentEventId}/zones/${activeZoneKey}`).update({
            status: "activo",
            photoUrl: "", 
            feedback: fbText
        }).then(() => {
            bootstrap.Modal.getInstance(document.getElementById('galleryModal')).hide();
        });
    }

    // 🚀 INTEGRACIÓN COMPLETA DE TU API CON TU LÓGICA DE FILTRADO DE CONFIANZA
    function approveAndCount() {
        const targetZone = currentZonesData[activeZoneKey];
        const base64Photo = targetZone.photoUrl; // Extraemos el archivo que subió el operador
        
        const btn = document.getElementById('ai-trigger-btn');
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status"></span> Analyzing image objects...`;

        // NOTA: Reemplaza "http://localhost:5000/predict" por la URL de tu endpoint real de Flask/Node
        fetch("http://localhost:5000/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ image: base64Photo })
        })
        .then(response => {
            if (!response.ok) throw new Error("API HTTP Error status: " + response.status);
            return response.json();
        })
        .then(aiResponse => {
            // ==============================================
            // 🎯 INYECCIÓN DE TU SCRIPT DE ANÁLISIS DE OBJETOS
            // ==============================================
            const CONFIDENCE_THRESHOLD = 0.5;
            const TARGET_CLASS = "person";
            const results = aiResponse?.images?.[0]?.results || [];
            
            let attendance = 0;

            results.forEach((obj) => {
                const { name, confidence } = obj;
                
                // Ignorar objetos por debajo del umbral de certeza (como el de 0.48006)
                if (confidence < CONFIDENCE_THRESHOLD) return;

                // Sumar al contador oficial únicamente si es una persona
                if (name === TARGET_CLASS) {
                    attendance++;
                }
            });
            // ==============================================

            // Subimos a Firebase el conteo exacto filtrado por ti
            return database.ref(`events/${currentEventId}/zones/${activeZoneKey}`).update({
                status: "terminado",
                count: attendance, 
                feedback: "Accepted & Processed via CATCH AI Engine"
            });
        })
        .then(() => {
            bootstrap.Modal.getInstance(document.getElementById('galleryModal')).hide();
        })
        .catch(err => {
            alert("AI Server Communication Error: " + err.message);
            btn.disabled = false;
            btn.innerHTML = `✅ Accept & AI Count`;
        });
    }

    function updateSaveButton() {
        const zonesKeys = Object.keys(currentZonesData);
        if(zonesKeys.length === 0) return;
        
        const allDone = zonesKeys.every(k => currentZonesData[k].status === 'terminado');
        const btn = document.getElementById('save-session-btn');
        allDone ? btn.classList.remove('d-none') : btn.classList.add('d-none');
    }

    function saveToSystem() {
        let totalAttendance = 0;
        let breakdown = [];
        
        Object.keys(currentZonesData).forEach(k => {
            totalAttendance += currentZonesData[k].count;
            breakdown.push({ name: currentZonesData[k].name, count: currentZonesData[k].count });
        });

        const archiveRecord = {
            name: document.getElementById('display-name').innerText,
            date: document.getElementById('display-date').innerText.replace("Event Date: ", ""),
            total: totalAttendance,
            breakdown: breakdown
        };

        let localHistory = localStorage.getItem('catch_saved_event_history');
        localHistory = localHistory ? JSON.parse(localHistory) : [];
        localHistory.unshift(archiveRecord);
        localStorage.setItem('catch_saved_event_history', JSON.stringify(localHistory));

        database.ref('events/' + currentEventId).remove().then(() => {
            alert("Success: Event finalized, verified and committed to historical records.");
            location.reload();
        });
    }

    function cancelSession() {
        if (confirm("Completely wipe this live cloud session? Operators will lose access immediately.")) {
            database.ref('events/' + currentEventId).remove().then(() => {
                location.reload();
            });
        }
    }

    window.onload = listenToLiveSession;
  </script>
</body>
</html>
