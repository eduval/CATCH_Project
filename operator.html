<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8">
    <title>CATCH | Operator Hub</title>
    <meta name="viewport" content="width=device-width, maximum-scale=5, initial-scale=1">

    <link rel="stylesheet" href="assets/css/core.min.css">
    <link rel="stylesheet" href="assets/css/vendor_bundle.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap">
    <link rel="shortcut icon" href="favicon.ico">

    <script>
      if (localStorage.getItem('isLoggedIn') !== 'true' || localStorage.getItem('userRole') !== 'operator') {
        window.location.href = 'login.html';
      }
    </script>
  </head>

<body class="bg-light min-vh-100 header-sticky" data-s2t-class="btn-primary btn-sm bg-gradient-default rounded-circle border-0">

  <div id="wrapper" class="d-flex align-items-stretch flex-column">

    <header id="header" class="d-flex align-items-center shadow-xs bg-white">
      <div class="container-fluid position-relative px-4"> 
        <nav class="navbar navbar-expand-lg navbar-light justify-content-between w-100 p-0">
          
          <div class="align-items-start">
            <a class="navbar-brand mx-0" href="#">
              <span class="h3 fw-bold text-primary">CATCH</span>
              <span class="badge bg-primary-soft text-primary model-label ms-2 smaller">OPERATOR HUB</span>
            </a>
          </div>

          <ul class="list-inline list-unstyled mb-0 d-flex align-items-center">
            <li class="list-inline-item mx-1 dropdown">
              <a href="#" class="btn btn-sm btn-light rounded-circle text-primary-hover dropdown-toggle" data-bs-toggle="dropdown"><i class="fi fi-bell"></i></a>
            </li>
            <li class="list-inline-item mx-1 dropdown">
              <a href="#" id="dropdownAccountOptions" class="btn btn-sm btn-icon btn-light dropdown-toggle rounded-circle shadow bg-cover" style="background-image:url(assets/images/avatars/admin.jpg)" data-bs-toggle="dropdown" aria-haspopup="true"></a>
              <div aria-labelledby="dropdownAccountOptions" class="dropdown-menu dropdown-menu-clean dropdown-menu-navbar-autopos dropdown-menu-invert p-0 mt-2 w-300">
                <div class="dropdown-header bg-primary text-white p-4 text-start">
                  <span class="d-block fw-medium">Operator User</span>
                  <span class="d-block smaller">operator@catch.hub</span>
                </div>
                <div class="dropdown-divider mb-0"></div>
                <a href="#" onclick="handleLogout()" class="dropdown-footer fw-medium py-3 px-4 text-danger"><i class="fi fi-power float-start me-2"></i> Log Out</a>
              </div>
            </li>
          </ul>

        </nav>
      </div>
    </header>

    <div class="flex-fill w-100">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-12 col-lg-10">

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div>
                <h1 class="h4 fw-bold text-dark m-0" id="event-title-display">Services List</h1>
                <p class="text-muted small mb-0" id="event-date-display">Waiting for active cloud session...</p>
              </div>
              <div id="connection-status">
                <span class="badge bg-secondary-soft text-secondary px-3 py-2">🔄 CONNECTING...</span>
              </div>
            </div>

            <div class="card shadow-sm border-0 rounded-xl bg-white p-4">
              <div class="table-responsive">
                <table class="table table-align-middle table-edge-links mb-0">
                  <thead>
                    <tr class="text-muted small text-uppercase data-header">
                      <th class="w--50"></th> 
                      <th>Service / Zone</th>
                      <th>Target Date</th>
                      <th>Status</th>
                      <th class="text-end">Action</th>
                    </tr>
                  </thead>
                  <tbody id="operator-table-body">
                    <tr>
                      <td colspan="5" class="text-center py-5 text-muted">
                        <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                        Loading live operational tracking...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <input type="file" id="global-camera-input" accept="image/*" capture="environment" class="d-none" onchange="handleFileSelection(this)">

    <footer id="footer" class="bg-white shadow py-3 text-center text-muted smaller">
      &copy; 2026 CATCH Attendance Hub Network.
    </footer>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script src="assets/js/core.min.js"></script>
  <script src="assets/js/vendor_bundle.min.js"></script>

  <script>
    // Tu configuración idéntica de Firebase
    const firebaseConfig = {
  apiKey: "AIzaSyBviEaIKKwNPXnxQcHlq3y-Zzs8bY-SqaU",
  authDomain: "cctb-catch-testing.firebaseapp.com",
  databaseURL: "https://cctb-catch-testing-default-rtdb.firebaseio.com",
  projectId: "cctb-catch-testing",
  storageBucket: "cctb-catch-testing.firebasestorage.app",
  messagingSenderId: "734153648345",
  appId: "1:734153648345:web:7692ec17fc87adc463b6c8",
  measurementId: "G-PSTJ6T7LC7"
};

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const currentEventId = "active_session"; 
    let targetZoneKeyUpload = null; // Almacén temporal de la zona a la que se le sube archivo
    let globalEventDate = "";

    // ESCUCHAR EN TIEMPO REAL LA SESIÓN DEL ADMIN
    function initOperatorSync() {
      database.ref('events/' + currentEventId).on('value', (snapshot) => {
        const data = snapshot.val();
        const tbody = document.getElementById('operator-table-body');
        const statusBadge = document.getElementById('connection-status');

        if (!data) {
          document.getElementById('event-title-display').innerText = "No Live Session";
          document.getElementById('event-date-display').innerText = "The administrator hasn't launched a session yet.";
          statusBadge.innerHTML = `<span class="badge bg-secondary-soft text-secondary px-3 py-2">● IDLE</span>`;
          tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted fw-bold">⚠️ Standby Mode: Waiting for Admin to trigger an event.</td></tr>`;
          return;
        }

        // Si hay datos, actualizamos el Header del bloque fino
        document.getElementById('event-title-display').innerText = data.name;
        globalEventDate = data.date;
        document.getElementById('event-date-display').innerText = "Operational Date: " + globalEventDate;
        statusBadge.innerHTML = `<span class="badge bg-success-soft text-success px-3 py-2 animate-pulse">● LIVE SYNCED</span>`;

        // Renderizar las zonas creadas como filas de la tabla
        tbody.innerHTML = "";
        const zones = data.zones || {};
        
        Object.keys(zones).forEach(zoneKey => {
          const z = zones[zoneKey];
          const tr = document.createElement('tr');

          // 1. Configuración de Badges y Botones según tus 3 estados planteados
          let statusBadgeHTML = '';
          let actionButtonHTML = '';

          if (z.status === 'terminado') {
            statusBadgeHTML = `<span class="badge bg-success-soft text-success fw-bold px-3 py-1">DONE</span>`;
            actionButtonHTML = `
              <div class="text-end text-success fw-bold small pe-2">
                <i class="fi fi-check-circle me-1"></i> Counted: ${z.count}
              </div>`;
          } else if (z.status === 'pendiente') {
            statusBadgeHTML = `<span class="badge bg-warning-soft text-warning fw-bold px-3 py-1 animate-flash">PENDING</span>`;
            actionButtonHTML = `
              <button class="btn btn-sm btn-light text-muted px-3 border" disabled>
                <div class="spinner-border spinner-border-sm me-1" role="status"></div> Pending Review
              </button>`;
          } else {
            // Estado: Activo (esperando foto o rechazado)
            if (z.feedback && z.feedback !== "Accepted") {
              statusBadgeHTML = `
                <span class="badge bg-danger-soft text-danger fw-bold px-3 py-1 d-block mb-1">REJECTED</span>
                <small class="text-danger d-block smaller fw-medium" style="max-width:200px;">❌ ${z.feedback}</small>`;
            } else {
              statusBadgeHTML = `<span class="badge bg-info-soft text-info fw-bold px-3 py-1">ACTIVE</span>`;
            }

            actionButtonHTML = `
              <button class="btn btn-sm btn-outline-primary fw-bold px-3 shadow-xs" onclick="triggerCameraInput('${zoneKey}')">
                <i class="fi fi-camera me-1"></i> Upload / Take Photo
              </button>`;
          }

          // 2. Insertamos la fila estructurada limpiamente
          tr.innerHTML = `
            <td><input class="form-check-input" type="checkbox" ${z.status === 'terminado' ? 'disabled checked' : ''}></td>
            <td>
              <span class="fw-bold text-dark d-block">${z.name}</span>
              <span class="text-muted smaller">Tracking: AI Camera Hub</span>
            </td>
            <td>
              <span class="text-secondary fw-medium">${formatDate(globalEventDate)}</span>
            </td>
            <td>${statusBadgeHTML}</td>
            <td class="text-end">${actionButtonHTML}</td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    function triggerCameraInput(zoneKey) {
      targetZoneKeyUpload = zoneKey;
      document.getElementById('global-camera-input').click();
    }

    // PROCESAR LA IMAGEN Y PASARLA A BASE64 PARA LA NUBE
    function handleFileSelection(input) {
      if (!input.files || !input.files[0] || !targetZoneKeyUpload) return;
      
      const file = input.files[0];
      const reader = new FileReader();
      
      reader.onload = function(e) {
        const base64Image = e.target.result;
        
        // Cambiamos el estado a "pendiente" para que pase a revisión del Admin
        database.ref(`events/${currentEventId}/zones/${targetZoneKeyUpload}`).update({
          status: "pendiente",
          photoUrl: base64Image, // Enviamos el String Base64 directo a la base de datos temporal
          feedback: ""
        }).then(() => {
          input.value = ""; // Reseteamos el input
          targetZoneKeyUpload = null;
        }).catch(err => alert("Upload error: " + err.message));
      };
      
      reader.readAsDataURL(file);
    }

    function formatDate(dateString) {
      if(!dateString) return "";
      const options = { month: 'short', day: 'numeric', year: 'numeric' };
      return new Date(dateString + 'T00:00:00').toLocaleDateString('en-US', options);
    }

    function handleLogout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    window.onload = initOperatorSync;
  </script>
</body>
</html>
